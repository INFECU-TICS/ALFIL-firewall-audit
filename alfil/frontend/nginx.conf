server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API al backend
    location /api/ {
        proxy_pass http://abackend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Servidor MCP remoto (HTTP). La resolución es perezosa para que nginx arranque aunque amcp no esté.
    resolver 127.0.0.11 valid=10s;
    location = /mcp {
        set $mcp_upstream http://amcp:8765;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: todas las rutas al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
