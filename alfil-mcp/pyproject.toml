[project]
name = "alfil-mcp"
version = "0.1.0"
description = "ALFIL-MCP: servidor MCP de solo lectura para Sophos Firewall v23 (REST API v1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
alfil-mcp = "alfil_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alfil_mcp = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
