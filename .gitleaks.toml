# Configuración de gitleaks: reglas por defecto + excepción para la spec OpenAPI del fabricante,
# cuyos ejemplos de documentación (claves compartidas, JWT, PEM truncado) generan falsos positivos.
title = "ALFIL"

[extend]
useDefault = true

[allowlist]
description = "Ejemplos de la especificación oficial de Sophos"
paths = ['''alfil-mcp/spec/openapi\.yaml''', '''alfil/frontend/scripts/check-snippets\.mjs''']  # el segundo: token de prueba falso (alfil_mcp_ABC123)
